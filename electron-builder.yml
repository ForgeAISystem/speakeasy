appId: com.theforge.speakeasy
productName: SpeakEasy
directories:
  output: dist
files:
  - src/**/*
  - package.json
asarUnpack:
  - node_modules/sherpa-onnx-*/**
  - node_modules/uiohook-napi/**
mac:
  extraResources:
    - from: build/native/speakeasy-fn
      to: native/speakeasy-fn
  binaries:
    - Contents/Resources/native/speakeasy-fn
  category: public.app-category.productivity
  target:
    - dmg
  # Uses an available Developer ID certificate when configured by the release owner.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: SpeakEasy needs the microphone to hear your dictation. Audio never leaves this computer.
dmg:
  title: Install SpeakEasy
  contents:
    - x: 130
      y: 190
    - x: 410
      y: 190
      type: link
      path: /Applications
win:
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: SpeakEasy
