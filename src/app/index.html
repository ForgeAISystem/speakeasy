<body>

<div id="layout">

    <div class="brand-block">
      <svg class="logo-mark" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="1" y="1" width="42" height="42" rx="11" fill="#1a1a1a"/>
        <rect x="11" y="16" width="5" height="13" rx="2.5" fill="#ffffeb"/>
        <rect x="19.5" y="10" width="5" height="24" rx="2.5" fill="#ffa946"/>

      </svg>
      <div class="brand-text">
        <div class="brand">Speak<em>Easy</em></div>
        <div class="brand-forge">Coded by <span>The Forge</span></div>
      </div>
    </div>
    <button class="nav-item active" data-tab="home" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
