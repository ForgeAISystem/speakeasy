<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>SpeakEasy</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/bricolage-grotesque/700.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/bricolage-grotesque/800.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/figtree/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/figtree/500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/figtree/600.css">

</head>
<body>

<div id="layout">
  <aside id="sidebar">
    <div class="brand-block">
      <svg class="logo-mark" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="1" y="1" width="42" height="42" rx="11" fill="#1a1a1a"/>
        <rect x="11" y="16" width="5" height="13" rx="2.5" fill="#ffffeb"/>
        <rect x="19.5" y="10" width="5" height="24" rx="2.5" fill="#ffa946"/>
        <rect x="28" y="18" width="5" height="9" rx="2.5" fill="#ffffeb"/>
      </svg>
      <div class="brand-text">
        <div class="brand">Speak<em>Easy</em></div>
        <div class="brand-forge">Coded by <span>The Forge</span></div>
      </div>
    </div>
    <div class="nav-item active" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
      Home
    </div>
    <div class="nav-item" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      History
    </div>
    <div class="nav-item" data-tab="dictionary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z"/></svg>
      Dictionary
    </div>
    <div class="nav-item" data-tab="snippets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      Snippets
    </div>
    <div class="nav-item" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h0a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h0a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v0a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Settings
    </div>
    <div class="spacer"></div>
    <div class="side-links">
      <button class="side-link" id="link-forge" title="Free tools from The Forge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.9 5.7 3.9 9S14.5 18.4 12 21c-2.5-2.6-3.9-5.7-3.9-9S9.5 5.6 12 3z"/></svg>
        The Forge &middot; free tools
      </button>
      <button class="side-link" id="link-coffee" title="Optional: support the free tools, $4.99/month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 8h1a3 3 0 010 6h-1M3 8h14v7a4 4 0 01-4 4H7a4 4 0 01-4-4V8zM7 2v2M11 2v2"/></svg>
        Buy me a coffee
      </button>
    </div>
    <div id="engine-pill" class="off"><span class="dot"></span><span id="engine-label">Starting</span></div>
  </aside>

  <main id="content">
    <section class="tab active" id="tab-home"></section>
    <section class="tab" id="tab-history"></section>
    <section class="tab" id="tab-dictionary"></section>
    <section class="tab" id="tab-snippets"></section>
    <section class="tab" id="tab-settings"></section>
  </main>
</div>

<div id="onboard"></div>

<script src="./app.js"></script>
</body>
</html>
