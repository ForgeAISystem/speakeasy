<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<title>SpeakEasy Bar</title>
<style>
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 14px;
  }
  #pill {
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(180deg, rgba(44, 44, 46, 0.96), rgba(24, 24, 26, 0.96));
    border: 1px solid rgba(255, 255, 235, 0.18);
    border-radius: 999px;
    padding: 9px 18px;
    min-width: 150px;
    justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16),
                0 2px 6px rgba(0, 0, 0, 0.25),
                0 14px 36px -8px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transform: translateY(18px) scale(0.94);
    transition: opacity 0.15s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #pill.visible { opacity: 1; transform: translateY(0) scale(1); }
  #wave { display: block; }

  /* Spinner: a thin gold arc that rotates while the model works. */
  #spinner {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(255, 169, 70, 0.22);
    border-top-color: #ffb867;
    border-right-color: #ff9a3c;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #label {
    color: rgba(255, 255, 255, 0.85);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #label .accent { color: #ffd5a4; }
  /* Word swap: gentle fade+rise as the processing verb changes. */
  #label.swap { animation: wordswap 0.34s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes wordswap {
    0% { opacity: 0; transform: translateY(3px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  #check { color: #46c07a; font-size: 14px; font-weight: 700; display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="pill">
    <canvas id="wave" width="76" height="26"></canvas>
    <div id="spinner"></div>
    <div id="check">&#10003;</div>
    <div id="label">Listening</div>
  </div>
</div>
<script src="./overlay.js"></script>
</body>
</html>
