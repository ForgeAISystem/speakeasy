<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<title>SpeakEasy Bar</title>
<style>
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 14px;
  }
  #pill {
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(180deg, rgba(53, 66, 49, 0.97), rgba(29, 40, 29, 0.97));
    border: 1px solid rgba(255, 255, 235, 0.18);
    border-radius: 18px;
    padding: 12px 16px;
    min-width: 210px; max-width: 300px;
    justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16),
                0 2px 6px rgba(0, 0, 0, 0.25),
                0 14px 36px -8px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transform: translateY(18px) scale(0.94);
    transition: opacity 0.15s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #pill.visible { opacity: 1; transform: translateY(0) scale(1); }
  #wave { display: block; }

  /* Spinner: a thin gold arc that rotates while the model works. */
  #spinner {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(255, 169, 70, 0.22);
    border-top-color: #ffb867;
    border-right-color: #ff9a3c;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #label {
    color: rgba(255, 255, 255, 0.85);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.35;
  }
  #label .accent { color: #ffd5a4; }
  /* Word swap: gentle fade+rise as the processing verb changes. */
  #label.swap { animation: wordswap 0.34s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes wordswap {
    0% { opacity: 0; transform: translateY(3px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  #check { color: #46c07a; font-size: 14px; font-weight: 700; display: none; }
  #hint { color: #bac7ae; font-size: 9px; line-height: 1.5; margin-top: 3px; }
  #hint.warn { color: #ffb4a6; font-weight: 600; }
  #elapsed { color: #f5c88c; font-size: 11px; font-variant-numeric: tabular-nums; margin-left: 2px; }
  .status-stack { min-width: 0; }
  [data-motion=off] * { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="pill" role="status" aria-live="polite">
    <canvas id="wave" width="55" height="25" aria-hidden="true"></canvas>
    <div id="spinner"></div>
    <div id="check">&#10003;</div>
    <div class="status-stack"><div id="label">Listening</div><div id="hint">Release to write · Esc to cancel</div></div><span id="elapsed" aria-hidden="true"></span>
  </div>
</div>
<script src="./overlay.js"></script>
</body>
</html>
