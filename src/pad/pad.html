<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>SpeakEasy Control Pad</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/600.css">
<link rel="stylesheet" href="./pad.css">
<link rel="stylesheet" href="./tiles.css">
</head>
<body>
<main id="pad" role="dialog" aria-label="Control Pad">
  <header><span class="title">Control Pad</span><span id="target" class="target"></span></header>
  <div class="stage">
    <div id="grid" class="grid"></div>
    <section id="plan" class="plan" hidden aria-live="polite">
      <div class="plan-eyebrow" id="plan-eyebrow">YOU SAID</div>
      <p class="plan-heard" id="plan-heard"></p>
      <ol class="plan-steps" id="plan-steps"></ol>
      <p class="plan-reply" id="plan-reply"></p>
      <div class="plan-actions" id="plan-actions" hidden><button type="button" id="plan-run">Run it</button><span><kbd>Return</kbd> runs · <kbd>Esc</kbd> cancels</span></div>
    </section>
    <section id="results" class="plan results" hidden aria-live="polite">
      <div class="plan-eyebrow">FROM YOUR HISTORY · ON THIS MAC</div>
      <p class="plan-heard" id="results-query"></p>
      <ol class="result-list" id="result-list"></ol>
      <p class="plan-reply" id="results-empty"></p>
      <div class="plan-actions" id="results-actions"><span><kbd>↑</kbd> <kbd>↓</kbd> picks · <kbd>Return</kbd> pastes · <kbd>Esc</kbd> closes</span></div>
    </section>
  </div>
  <footer><span id="status">Tap a key, or hold <kbd>fn</kbd> and say it</span><span class="keys"><kbd>Shift</kbd>+<kbd>1</kbd> saves · <kbd>Esc</kbd> closes</span></footer>
</main>
<script src="../shared/pad.js"></script>
<script src="./pad-ui.js"></script>
<script src="./pad.js"></script>
</body>
</html>
