<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>SpeakEasy tip</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/600.css">
<style>
html, body { margin: 0; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none;
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
#tip { position: fixed; left: 8px; right: 8px; bottom: 6px; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-radius: 14px; border: 1px solid rgba(255, 255, 235, 0.16); color: #ffffeb; font-size: 13px; line-height: 1.35;
  background: linear-gradient(180deg, rgba(43, 54, 40, 0.97), rgba(22, 30, 22, 0.98));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 12px 32px -10px rgba(0, 0, 0, 0.6);
  opacity: 0; transform: translateY(6px); transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
#tip.in { opacity: 1; transform: none; }
.eyebrow { flex: none; font: 600 9.5px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.12em; color: #ffb867; }
kbd { font: 600 11.5px 'JetBrains Mono', ui-monospace, monospace; color: #1a1a1a; background: #ffa946; border-radius: 5px; padding: 1px 6px; }
b { font-weight: 600; color: #ffd5a4; }
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } }
</style>
</head>
<body>
<div id="tip" role="status" aria-live="polite"><span class="eyebrow">FASTER</span><span id="text"></span></div>
<script src="./tip.js"></script>
</body>
</html>
